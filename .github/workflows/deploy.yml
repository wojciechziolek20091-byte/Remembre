# Publishes the site to GitHub Pages on every push to main.
#
# Pages has to be switched on for the repository once, by hand, before this can
# run: Settings -> Pages -> Source: GitHub Actions. A workflow token is not
# allowed to do that itself ("Resource not accessible by integration"), so
# there is no point asking configure-pages to try.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js sw.js favicon.svg manifest.webmanifest _site/
          cp -r fonts icons _site/
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
